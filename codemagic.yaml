workflows:
  fadmarket-ios-testflight-workflow:
    name: FAD Market iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # اسم الـ integration المضاف في حسابك على كودماجيك
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - FAD_Market_Manual_Profile # تم التعديل لاسم بروفايل FAD Market
        certificates:
          - ios_cert_manual # تم الإبقاء عليه كما هو بناءً على حسابك

    scripts:
      - name: Set iOS deployment target
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Clean and Get Dependencies
        script: |
          flutter clean
          flutter pub upgrade  # تحديث الحزم

          # تأكد من إنشاء مجلد ios قبل تنفيذ أوامر pod
          cd ios
          rm -rf Pods          # مسح مجلد الـ Pods القديم إن وجد
          rm -rf Podfile.lock  # مسح ملف القفل القديم إن وجد
          pod repo update      # تحديث مستودع الـ Pods
          pod install          # تثبيت الـ Pods من جديد

      - name: Apply Vault Profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
