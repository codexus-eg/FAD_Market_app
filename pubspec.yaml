name: fad_cnc_app
description: FAD Market mobile application.
publish_to: "none"

version: 1.0.0+2
environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/images/fce_logo.jpeg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/fce_logo.jpeg"
  remove_alpha_ios: true
