name: fad_cnc_app
description: FAD CNC mobile application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1" # أضف الحزمة هنا تحت القسم الموجود بالفعل

# ثم في نهاية الملف تماماً، تأكد من وجود هذا الجزء فقط:
flutter_icons:
  android: true
  ios: true
  image_path: "play_store_assets/app_icon_512.png"
  remove_alpha_ios: true

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/fce_logo.jpeg
