name: Build signed Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.0.12077973"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore and validate Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          cat > android/key.properties <<EOF_PROPERTIES
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF_PROPERTIES

          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties

          test -s android/upload-keystore.jks
          test -s android/key.properties

          keytool -list \
            -keystore android/upload-keystore.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Android signing files restored and validated successfully."

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd android
          gradle wrapper --gradle-version 8.11.1 --distribution-type all

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build signed release AAB
        run: flutter build appbundle --release

      - name: Verify bundle signature
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab >/tmp/aab-signature.txt
          tail -n 25 /tmp/aab-signature.txt

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAD-Market-AAB-v1.0.4-code47
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
